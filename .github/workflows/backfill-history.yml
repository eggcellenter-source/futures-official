name: Import verified settlement history
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['history-six-months.zip']
permissions:
  contents: read
concurrency:
  group: official-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Import official history collected in Taiwan
        run: unzip -n history-six-months.zip
      - name: Validate existing calculations
        run: node --test tests/*.test.mjs
      - name: Validate every imported date and monthly coverage
        run: |
          node --input-type=module <<'VALIDATE'
          import assert from 'node:assert/strict';
          import {readHistory} from './scripts/history.mjs';
          import {makeBoard} from './server/calculate.mjs';
          const days=await readHistory(process.cwd());
          const actual=new Set(days.map(d=>d.date));
          const expected=[...new Set(days.flatMap(d=>d.indexHistory.map(b=>b.date)))].filter(d=>d>=days[0].date&&d<=days.at(-1).date);
          assert.deepEqual(expected.filter(d=>!actual.has(d)),[],'Missing official trading dates');
          const board=makeBoard(days);
          for(const month of ['202604','202605','202606','202607','202608','202609','202610']) {
            const c=board.find(c=>c.meta.near_month===month);
            assert.ok(c&&c.rows.length>200&&c.meta.baseline_complete,'Incomplete settlement '+month);
          }
          console.log(JSON.stringify({tradingDays:days.length,months:board.map(c=>c.meta.near_month)}));
          VALIDATE
      - name: Refresh latest official snapshot
        run: node scripts/update.mjs
      - name: Build complete historical platform
        run: node scripts/build.mjs
      - name: Save verified official history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ scripts/backfill.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Add six months of verified official settlement history"
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
