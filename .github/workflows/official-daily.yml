name: Official daily data and Pages
on:
  schedule:
    # UTC: Taiwan 18:30 and 22:30. GitHub may delay scheduled jobs.
    - cron: '30 10,14 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Optional official trading date: YYYY-MM-DD'
        required: false
        type: string
  push:
    branches: [main]
    paths-ignore: ['data/**', '**.md']

permissions:
  contents: read
concurrency:
  group: official-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Initialize reviewed source package on first run
        run: |
          if [ ! -f package.json ]; then
            unzip -n futures-official-source.zip -x '.github/*' 'public/*'
          fi
      - name: Test calculations and update safety
        run: node --test tests/*.test.mjs
      - name: Fetch and validate all three official sources
        run: node scripts/update.mjs
        env:
          REQUESTED_DATE: ${{ inputs.date }}
      - name: Build all pages from the same snapshot
        run: node scripts/build.mjs
      - name: Save source and verified official history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ server/ scripts/ src/ templates/ tests/ package.json .gitignore README.md
          if ! git diff --cached --quiet; then
            git commit -m "Update verified official market data"
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish complete snapshot
        id: deployment
        uses: actions/deploy-pages@v4
