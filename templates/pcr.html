<title>選擇權結算 PCR 訊號 · 期權都齊全</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧭</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600;800&display=swap">
<style>
  :root{
    --bg:#faf8f3; --surface:#ffffff; --stripe:#f5f1e8; --head:#f0ebe0;
    --ink:#1b1a16; --ink-soft:#69645a; --ink-faint:#9c9583;
    --line:#e6e0d2; --line-soft:#efe9dd;
    --up:#c0392b; --up-bg:rgba(192,57,43,.12);
    --down:#0f8a4c; --down-bg:rgba(15,138,76,.12);
    --accent:#2a5da0; --accent-bg:rgba(42,93,160,.10); --rest-bg:#eceadf;
    color-scheme:light;
  }
  :root:not([data-theme="light"]){ @media (prefers-color-scheme:dark){
    --bg:#131209; --surface:#1b1910; --stripe:#211e14; --head:#252115;
    --ink:#f0ede3; --ink-soft:#a69e8c; --ink-faint:#726a5a;
    --line:#302b20; --line-soft:#28241a;
    --up:#ff6a5f; --up-bg:rgba(255,106,95,.14); --down:#3cc879; --down-bg:rgba(60,200,121,.14);
    --accent:#78ade6; --accent-bg:rgba(120,173,230,.14); --rest-bg:#242116;
  }}
  :root[data-theme="dark"]{
    --bg:#131209; --surface:#1b1910; --stripe:#211e14; --head:#252115;
    --ink:#f0ede3; --ink-soft:#a69e8c; --ink-faint:#726a5a;
    --line:#302b20; --line-soft:#28241a;
    --up:#ff6a5f; --up-bg:rgba(255,106,95,.14); --down:#3cc879; --down-bg:rgba(60,200,121,.14);
    --accent:#78ade6; --accent-bg:rgba(120,173,230,.14); --rest-bg:#242116;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);line-height:1.5;
    font-family:"Noto Sans TC",system-ui,"Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased}
  .num{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
  .wrap{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:0 56px}
  header.top{border-bottom:1px solid var(--line);background:var(--surface)}
  .top-in{max-width:820px;margin:0 auto;padding:14px 16px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .logo{font-weight:900;font-size:19px;letter-spacing:.3px}
  .logo b{color:var(--accent)}
  .tag{font-size:12.5px;color:var(--ink-soft);margin-right:auto}
  .themebtn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}

  .hero{margin-top:20px;border-radius:16px;border:1px solid var(--line);overflow:hidden;box-shadow:0 6px 20px rgba(30,26,18,.06)}
  .hero-top{display:flex;flex-wrap:wrap;gap:16px;padding:18px 20px;align-items:center}
  .hero.up .hero-top{background:var(--up-bg)} .hero.down .hero-top{background:var(--down-bg)}
  .sig-badge{display:flex;flex-direction:column;gap:2px}
  .sig-badge .lab{font-size:12px;color:var(--ink-soft);font-weight:600}
  .sig-badge .big{font-size:26px;font-weight:900;letter-spacing:.5px}
  .hero.up .big{color:var(--up)} .hero.down .big{color:var(--down)}
  .sig-num{margin-left:auto;text-align:right}
  .sig-num .pcr{font-size:34px;font-weight:800}
  .sig-num .pcr small{font-size:14px;color:var(--ink-faint);font-weight:600}
  .sig-num .sub{font-size:12px;color:var(--ink-soft)}
  .hero-note{padding:12px 20px;font-size:13px;color:var(--ink-soft);border-top:1px solid var(--line-soft);background:var(--surface)}
  .hero-note b{color:var(--ink)}
  .nextrow{display:flex;gap:18px;flex-wrap:wrap;padding:12px 20px;background:var(--surface);border-top:1px solid var(--line-soft);font-size:13.5px}
  .nextrow .k{color:var(--ink-soft)} .nextrow b{color:var(--ink);font-weight:700}

  h2.sec{font-size:16px;font-weight:800;margin:30px 0 6px}
  .hint{font-size:12.5px;color:var(--ink-faint);margin:0 0 12px}
  .seg{display:inline-flex;background:var(--head);border:1px solid var(--line);border-radius:9px;padding:3px;margin-bottom:14px}
  .seg button{border:none;background:transparent;color:var(--ink-soft);cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;padding:7px 13px;border-radius:7px}
  .seg button.on{background:var(--surface);color:var(--ink)}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .btrow{display:grid;grid-template-columns:76px 1fr 46px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-soft)}
  .btrow:last-child{border-bottom:none}
  .btrow .pcrlab{font-weight:700;font-size:13.5px}
  .btrow .pcrlab small{display:block;font-size:11px;color:var(--ink-faint);font-weight:500}
  .bars{display:flex;flex-direction:column;gap:5px}
  .bar{position:relative;height:18px;background:var(--stripe);border-radius:5px;overflow:hidden}
  .bar > span{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
  .bar.nf > span{background:var(--up)} .bar.nr > span{background:var(--down)}
  .bar em{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-style:normal;font-size:11px;font-weight:700;color:var(--ink)}
  .bar .tagn{position:absolute;left:7px;top:50%;transform:translateY(-50%);font-size:10.5px;color:#fff;font-weight:600}
  .btrow .nlab{font-size:11px;color:var(--ink-faint);text-align:right}
  .leg{display:flex;gap:16px;font-size:12px;color:var(--ink-soft);margin:2px 0 12px}
  .leg span{display:flex;align-items:center;gap:5px}
  .dot{width:11px;height:11px;border-radius:3px}

  .scroll{overflow-x:auto;margin-top:6px}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
  thead th{background:var(--head);color:var(--ink-soft);font-size:11.5px;font-weight:700;text-align:right;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  thead th.l{text-align:left}
  tbody td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--line-soft);white-space:nowrap}
  tbody tr:nth-child(even) td{background:var(--stripe)}
  td.l{text-align:left}
  .kbadge{display:inline-block;padding:1px 7px;border-radius:5px;font-size:11px;font-weight:700}
  .kbadge.r{color:var(--up);background:var(--up-bg)} .kbadge.b{color:var(--down);background:var(--down-bg)}
  .flag{font-weight:700} .flag.nf{color:var(--up)} .flag.nr{color:var(--down)} .flag.dim{color:var(--ink-faint)}
  .pcrpill{font-weight:700} .pcrpill.hi{color:var(--up)} .pcrpill.lo{color:var(--down)}
  .foot{margin-top:24px;font-size:12px;color:var(--ink-soft);line-height:1.75}
  .foot b{color:var(--ink)} .foot code{background:var(--head);padding:1px 6px;border-radius:5px;font-family:"JetBrains Mono",monospace;font-size:11px}
</style>

<style>
  .sitenav{display:flex;gap:4px;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 12px;overflow-x:auto}
  .sitenav a{flex:none;text-decoration:none;color:var(--ink-soft);font-size:13px;font-weight:600;padding:6px 12px;border-radius:8px;white-space:nowrap}
  .sitenav a:hover{background:var(--stripe);color:var(--ink)}
  .sitenav a.active{background:var(--accent-bg);color:var(--accent)}
  :root[data-theme="dark"]{color-scheme:dark}
  @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
  [data-tip]{cursor:help}
  th[data-tip]{text-decoration:underline dotted var(--ink-faint);text-underline-offset:3px}
  .ttpop{position:fixed;max-width:300px;background:var(--ink);color:var(--bg);padding:8px 11px;
    border-radius:8px;font-size:12px;line-height:1.55;z-index:200;pointer-events:none;
    box-shadow:0 8px 26px rgba(0,0,0,.28)}
</style>

<header class="top">
  <div class="top-in">
    <span class="logo">選擇權結算 <b>PCR</b> 訊號</span>
    <span class="tag">未平倉 P/C ratio × 結算日 K 棒</span>
    <button class="themebtn" id="theme" title="深淺色">◐</button>
  </div>
</header>

<div class="wrap">
  <div class="hero" id="hero"></div>

  <h2 class="sec">PCR 對結算日 K 棒的歷史關係</h2>
  <p class="hint" id="bt-hint"></p>
  <div class="seg" id="bt-toggle">
    <button data-g="wed" class="on">週三選(含月選)</button>
    <button data-g="all">全部結算</button>
    <button data-g="fri">週五選</button>
  </div>
  <div class="leg">
    <span><span class="dot" style="background:var(--up)"></span>不跌率(紅K或下引線)</span>
    <span><span class="dot" style="background:var(--down)"></span>不漲率(黑K或上引線)</span>
  </div>
  <div class="card" id="bt-chart"></div>

  <h2 class="sec">近期結算日結果</h2>
  <p class="hint">前一日 PCR ≥100(紅)偏不跌、&lt;100(綠)偏不漲。結果欄只看引線:守=下引線(偏不跌)、壓=上引線(偏不漲)、—=無明顯引線。</p>
  <div class="card" style="padding:0"><div class="scroll"><table>
    <thead><tr>
      <th class="l">結算日</th>
      <th class="l">類型</th>
      <th data-tip="結算日『前一交易日』收盤的未平倉 PC ratio。≥100(紅)偏不跌、<100(綠)偏不漲,分水嶺≈100。">前日PCR</th>
      <th data-tip="結算日大盤(加權指數)當天:收紅K(收盤>開盤)或黑K(收盤<開盤)。">K棒</th>
      <th data-tip="只看上下引線(K棒紅黑已在前欄):守=較長下引線(盤中被拉回、收相對高→偏不跌);壓=較長上引線(盤中被壓回、收相對低→偏不漲);—=無明顯引線。">結果</th>
      <th data-tip="結算日大盤漲跌幅 =(結算日收盤 − 前一日收盤)÷ 前一日收盤 × 100%。正=紅(漲)、負=綠(跌)。跟結果欄不一定一致(引線看盤中、報酬看收盤)。">報酬</th>
    </tr></thead>
    <tbody id="recent-body"></tbody>
  </table></div></div>

  <div class="foot" id="foot"></div>
</div>

<script>
const DATA = null;
const M = DATA.meta;
const wk = {2:'三',4:'五'};

// ---- hero ----
const up = M.signal==='not_fall';
const hero = document.getElementById('hero');
hero.className = 'hero ' + (up?'up':'down');
const ns = M.next_settle;
hero.innerHTML = `
  <div class="hero-top">
    <div class="sig-badge">
      <span class="lab">最新 PCR ${M.latest_pcr>=M.pivot?'≥':'<'} ${M.pivot} 訊號</span>
      <span class="big">${up?'偏不跌 ▲':'偏不漲 ▼'}</span>
      <span class="lab">${up?'紅K或下引線機率高(偏多守)':'黑K或上引線機率高(偏空壓)'}</span>
    </div>
    <div class="sig-num">
      <div class="pcr num" style="color:${up?'var(--up)':'var(--down)'}">${M.latest_pcr}<small>%</small></div>
      <div class="sub">未平倉 PC ratio · ${M.latest_pcr_date}</div>
    </div>
  </div>
  <div class="nextrow">
    <span><span class="k">下一個結算日</span> <b class="num">${ns?ns.date:'—'}</b>（週${ns?ns.weekday:'?'}）<b>${ns?ns.kind:''}</b></span>
    <span><span class="k">分水嶺</span> PCR <b class="num">${M.pivot}</b></span>
  </div>
  <div class="hero-note">
    <b>讀法：</b>結算日前一交易日的未平倉 PC ratio ≥ ${M.pivot} → 結算日偏「不跌」；&lt; ${M.pivot} → 偏「不漲」。
    以<b>週三選(含月選)</b>最準(下方 100–120 區間不跌率 86–88%);週五選較弱。此為機率傾向,非保證。
  </div>`;

// ---- backtest bars ----
function bar(cls, pct){
  const w = pct==null?0:pct;
  return `<div class="bar ${cls}"><span style="width:${w}%"></span><em>${pct==null?'—':pct+'%'}</em></div>`;
}
function renderBT(g){
  const arr = DATA.buckets[g];
  document.getElementById('bt-chart').innerHTML = arr.map(b=>`
    <div class="btrow">
      <div class="pcrlab">${b.label}<small>PCR</small></div>
      <div class="bars">${bar('nf',b.notfall)}${bar('nr',b.notrise)}</div>
      <div class="nlab">n=${b.n}<br>${b.ret==null?'':(b.ret>0?'+':'')+b.ret+'%'}</div>
    </div>`).join('');
  document.getElementById('bt-hint').textContent =
    g==='wed' ? '週三選(含月選):到期在週三,作結算誘因最強、訊號最乾淨。'
    : g==='all' ? '全部結算日(週三+週五+月選)合計。'
    : '週五選:訊號較弱、較雜,實戰以週三/月選為主。';
}
document.getElementById('bt-toggle').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b)return;
  document.querySelectorAll('#bt-toggle button').forEach(x=>x.classList.toggle('on',x===b));
  renderBT(b.dataset.g);
});
renderBT('wed');

// ---- recent table ----
document.getElementById('recent-body').innerHTML = DATA.recent.slice().reverse().map(r=>{
  const hi = r.pcr>=M.pivot;
  const res = r.result==='守' ? '<span class="flag nf">守</span>'
            : r.result==='壓' ? '<span class="flag nr">壓</span>'
            : '<span class="flag dim">—</span>';
  return `<tr>
    <td class="l num">${r.d}</td>
    <td class="l">${r.kind.replace(/;/g,' · ')}</td>
    <td class="num pcrpill ${hi?'hi':'lo'}">${r.pcr}</td>
    <td><span class="kbadge ${r.red?'r':'b'}">${r.red?'紅K':'黑K'}</span></td>
    <td>${res}</td>
    <td class="num" style="color:${r.ret>0?'var(--up)':r.ret<0?'var(--down)':'var(--ink-soft)'}">${r.ret>0?'+':''}${r.ret}%</td>
  </tr>`;
}).join('');

// ---- foot ----
document.getElementById('foot').innerHTML =
  `<b>PCR</b> = 台指選擇權「未平倉量」買賣權比率(Put/Call OI ratio),取結算日<b>前一交易日</b>收盤值。<br>`+
  `<b>不跌</b> = 結算日收<b>紅K</b>(收>開)或有明顯<b>下引線</b>(下影≥全長1/3);<b>不漲</b> = 收<b>黑K</b>或明顯<b>上引線</b>。兩者為 OR 定義、可同時成立,故不跌率+不漲率可能>100%。<br>`+
  `<b>結算日</b> = 每週三、週五、及月選第3個週三;遇假日順延次一營業日。報酬為結算日收盤 vs 前一日收盤。<br>`+
  `樣本 ${M.n_settle} 個結算日(${M.range})。資料源:期交所 PCR、證交所加權指數 OHLC。重跑 <code>選擇權PCR結算_抓取.py</code> 更新。更新於 ${M.updated}。`;

// ---- theme ----
const tb=document.getElementById('theme');
try{const t=localStorage.getItem('pcr-theme'); if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
tb.addEventListener('click',()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const dark=cur?cur==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  const nx=dark?'light':'dark'; document.documentElement.setAttribute('data-theme',nx);
  try{localStorage.setItem('pcr-theme',nx);}catch(e){}
});

// ---- 自訂 tooltip(靠右往左展開、超界夾回、點擊可切) ----
const tt=document.createElement('div'); tt.className='ttpop'; tt.hidden=true; document.body.appendChild(tt);
function showTip(el){
  tt.textContent=el.getAttribute('data-tip'); tt.hidden=false;
  const r=el.getBoundingClientRect(), tw=tt.offsetWidth, th=tt.offsetHeight;
  let left=Math.max(8,Math.min(r.right-tw, window.innerWidth-tw-8));
  let top=r.bottom+6; if(top+th>window.innerHeight-8) top=r.top-th-6;
  tt.style.left=left+'px'; tt.style.top=Math.max(8,top)+'px';
}
document.addEventListener('mouseover',e=>{const el=e.target.closest('[data-tip]'); if(el) showTip(el);});
document.addEventListener('mouseout',e=>{if(e.target.closest('[data-tip]')) tt.hidden=true;});
document.addEventListener('click',e=>{const el=e.target.closest('[data-tip]'); if(el){ tt.hidden?showTip(el):(tt.hidden=true); }});
</script>
